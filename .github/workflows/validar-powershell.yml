# Diseñado por DevPoderSEO
name: Validar PowerShell
on:
  push:
    branches: [main]
  pull_request:
jobs:
  sintaxis-y-interfaz:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis con Windows PowerShell 5.1
        shell: powershell
        run: .\tests\ValidarSintaxis.ps1
      - name: Probar tablas de interfaz sin cambiar Windows
        shell: powershell
        run: .\tests\ProbarInterfaz.ps1
      - name: Verificar soporte técnico v1.7 y CCTV v1.8 sin cambios ni tráfico
        shell: powershell
        run: .\tests\ProbarSoporteCCTV.ps1
      - name: Probar juegos instalados en bibliotecas Steam
        shell: powershell
        run: .\tests\ProbarSteamGames.ps1
      - name: Probar desinstalación Steam, MSI y acciones seguras
        shell: powershell
        run: .\tests\ProbarDesinstalacion.ps1
      - name: Probar alcance y seguridad de diagnóstico de redes
        shell: powershell
        run: .\tests\ProbarDiagnosticoRed.ps1
      - name: Validar recomendaciones portátiles
        shell: powershell
        run: .\tests\ProbarRecomendaciones.ps1
      - name: Validar informes técnicos seguros
        shell: powershell
        run: .\tests\ProbarTaller.ps1
      - name: Comprobar seguridad de candidatos de limpieza
        shell: powershell
        run: .\tests\ProbarLimpieza.ps1
      - name: Construir y verificar ZIP Ventoy
        shell: powershell
        run: .\packaging\CrearPaquete.ps1 -DestinationDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist')
      - name: Publicar ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: WinCarePortable-v2.0-USB
          path: dist/WinCarePortable-v2.0.zip
          if-no-files-found: error
          retention-days: 30
